<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reload Staff Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 953 958'%3E%3Cpath fill='%23AA7655' d='M0 0H620A292 295 0 0 1 660 592L950 955H725L455 620H258L155 480H560A170 170 0 0 0 570 142H0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=2.29.0">
</head>
<body>

<div id="progress" class="progress-line hidden"><div></div></div>

<div id="boot" class="boot hidden"><div class="spinner" aria-label="Loading"></div></div>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 953 958" aria-label="Reload"><path d="M0 0H620A292 295 0 0 1 660 592L950 955H725L455 620H258L155 480H560A170 170 0 0 0 570 142H0Z"/></svg></div>
    <h1>Reload Staff Hub</h1>
    <p class="muted">Log in with your NIK and PIN</p>

    <label class="field-label" for="loginNik">NIK</label>
    <input id="loginNik" class="input" type="text" inputmode="numeric" autocomplete="username">

    <label class="field-label" for="loginPin">PIN</label>
    <input id="loginPin" class="input" type="password" inputmode="numeric" autocomplete="current-password">

    <div id="loginError" class="error"></div>
    <button id="loginBtn" class="btn block" type="button">Log in</button>
  </div>
  <footer class="footer">Reload Staff Hub · v<span class="app-version"></span></footer>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand"><span class="logo sm"><svg viewBox="0 0 953 958" aria-hidden="true"><path d="M0 0H620A292 295 0 0 1 660 592L950 955H725L455 620H258L155 480H560A170 170 0 0 0 570 142H0Z"/></svg></span><span>Reload Staff Hub</span></div>
      <div class="user">
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-meta">
          <div class="user-name" id="userName"></div>
          <div class="user-tier" id="userTier"></div>
        </div>
        <button class="ghost" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
    <nav id="tabbar" class="tabbar container tabs"></nav>
  </header>

  <main id="app" class="container"></main>
  <footer class="footer">Reload Staff Hub · v<span class="app-version"></span></footer>
</div>

<div id="detailModal" class="modal hidden">
  <div class="modal-box guest-box">
    <div class="modal-head">
      <h2 id="detailTitle"></h2>
      <button class="ghost" id="detailClose" type="button">Close</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div id="photoModal" class="modal photo-modal hidden" aria-label="Photo">
  <img id="photoFull" alt="">
  <button class="ghost photo-close" type="button">Close</button>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="editTitle">Edit</h2>
      <button class="ghost" id="editClose" type="button">Close</button>
    </div>
    <form id="editForm" class="edit-form"></form>
    <div id="editError" class="error"></div>
    <div class="modal-actions">
      <button id="editSave" class="btn block" type="button">Save</button>
      <button id="editDelete" class="btn danger block hidden" type="button">Delete this row</button>
    </div>
  </div>
</div>

<div id="guestModal" class="modal hidden">
  <div class="modal-box guest-box">
    <div class="modal-head">
      <h2>Guest details</h2>
      <button class="ghost" id="guestClose" type="button">Close</button>
    </div>
    <div id="guestBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js?v=2.31.0"></script>
</body>
</html>
