<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reload Staff Hub</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="card login-card">
    <div class="brand big">Reload Staff Hub</div>
    <p class="caption">Masuk dengan NIK dan PIN kamu</p>

    <input id="loginNik" class="input" type="text" inputmode="numeric"
           placeholder="NIK" autocomplete="username">
    <input id="loginPin" class="input" type="password" inputmode="numeric"
           placeholder="PIN" autocomplete="current-password">

    <div id="loginError" class="error"></div>
    <button id="loginBtn" class="btn" type="button">Masuk</button>
  </div>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div>
      <div class="brand">Reload Staff Hub</div>
      <div class="caption" id="userBadge"></div>
    </div>
    <button class="ghost" id="logoutBtn" type="button">Keluar</button>
  </header>

  <main id="app" class="container"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>

<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
