<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index.html</title>
<style>
:root{--bg:#0b0b0c;--surface:#141416;--border:rgba(255,255,255,.08);--text:#f5f3ef;--muted:#8e8a84;--accent:#AA7655}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.title{font-weight:700}
.meta{color:var(--muted);font-size:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.done{background:#2f7d4f}
pre{margin:0;padding:16px 18px 48px;white-space:pre;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--surface)}
</style></head>
<body>
<header>
  <div><div class="title">index.html</div><div class="meta">Frontend · v2.6.0 · 73 baris</div></div>
  <button id="copy">Copy</button>
</header>
<pre id="code"></pre>
<script>
const CODE = "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Reload Staff Hub<\/title>\n<link rel=\"icon\" href=\"data:,\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\">\n<link rel=\"stylesheet\" href=\"style.css?v=2.6.0\">\n<\/head>\n<body>\n\n<div id=\"loginScreen\" class=\"login-screen\">\n  <div class=\"login-card\">\n    <div class=\"logo\">R<\/div>\n    <h1>Reload Staff Hub<\/h1>\n    <p class=\"muted\">Masuk dengan NIK dan PIN kamu<\/p>\n\n    <label class=\"field-label\" for=\"loginNik\">NIK<\/label>\n    <input id=\"loginNik\" class=\"input\" type=\"text\" inputmode=\"numeric\" autocomplete=\"username\">\n\n    <label class=\"field-label\" for=\"loginPin\">PIN<\/label>\n    <input id=\"loginPin\" class=\"input\" type=\"password\" inputmode=\"numeric\" autocomplete=\"current-password\">\n\n    <div id=\"loginError\" class=\"error\"><\/div>\n    <button id=\"loginBtn\" class=\"btn block\" type=\"button\">Masuk<\/button>\n  <\/div>\n<\/div>\n\n<div id=\"appShell\" class=\"hidden\">\n  <header class=\"topbar\">\n    <div class=\"container topbar-inner\">\n      <div class=\"brand\"><span class=\"logo sm\">R<\/span><span>Reload Staff Hub<\/span><\/div>\n      <div class=\"user\">\n        <div class=\"initials\" id=\"userInitials\"><\/div>\n        <div class=\"user-meta\">\n          <div class=\"user-name\" id=\"userName\"><\/div>\n          <div class=\"user-tier\" id=\"userTier\"><\/div>\n        <\/div>\n        <button class=\"ghost\" id=\"logoutBtn\" type=\"button\">Keluar<\/button>\n      <\/div>\n    <\/div>\n    <nav id=\"tabbar\" class=\"tabbar container tabs\"><\/nav>\n  <\/header>\n\n  <main id=\"app\" class=\"container\"><\/main>\n  <footer class=\"footer\">Reload Staff Hub · v<span id=\"appVersion\"><\/span><\/footer>\n<\/div>\n\n<div id=\"editModal\" class=\"modal hidden\">\n  <div class=\"modal-box\">\n    <div class=\"modal-head\">\n      <h2 id=\"editTitle\">Edit<\/h2>\n      <button class=\"ghost\" id=\"editClose\" type=\"button\">Tutup<\/button>\n    <\/div>\n    <form id=\"editForm\" class=\"edit-form\"><\/form>\n    <div id=\"editError\" class=\"error\"><\/div>\n    <div class=\"modal-actions\">\n      <button id=\"editSave\" class=\"btn block\" type=\"button\">Simpan<\/button>\n      <button id=\"editDelete\" class=\"btn danger block hidden\" type=\"button\">Hapus baris ini<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"toast\" class=\"toast hidden\"><\/div>\n\n<script src=\"config.js\"><\/script>\n<script src=\"app.js?v=2.6.0\"><\/script>\n<\/body>\n<\/html>\n";
document.getElementById('code').textContent = CODE;
document.getElementById('copy').addEventListener('click', async function(){
  const btn = this;
  try { await navigator.clipboard.writeText(CODE); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = CODE; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.textContent = 'Tersalin'; btn.classList.add('done');
});
</script>
</body></html>
