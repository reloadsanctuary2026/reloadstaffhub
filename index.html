<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reload Staff Hub</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=2.6.0">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">R</div>
    <h1>Reload Staff Hub</h1>
    <p class="muted">Masuk dengan NIK dan PIN kamu</p>

    <label class="field-label" for="loginNik">NIK</label>
    <input id="loginNik" class="input" type="text" inputmode="numeric" autocomplete="username">

    <label class="field-label" for="loginPin">PIN</label>
    <input id="loginPin" class="input" type="password" inputmode="numeric" autocomplete="current-password">

    <div id="loginError" class="error"></div>
    <button id="loginBtn" class="btn block" type="button">Masuk</button>
  </div>
</div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand"><span class="logo sm">R</span><span>Reload Staff Hub</span></div>
      <div class="user">
        <div class="initials" id="userInitials"></div>
        <div class="user-meta">
          <div class="user-name" id="userName"></div>
          <div class="user-tier" id="userTier"></div>
        </div>
        <button class="ghost" id="logoutBtn" type="button">Keluar</button>
      </div>
    </div>
    <nav id="tabbar" class="tabbar container tabs"></nav>
  </header>

  <main id="app" class="container"></main>
  <footer class="footer">Reload Staff Hub · v<span id="appVersion"></span></footer>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="editTitle">Edit</h2>
      <button class="ghost" id="editClose" type="button">Tutup</button>
    </div>
    <form id="editForm" class="edit-form"></form>
    <div id="editError" class="error"></div>
    <div class="modal-actions">
      <button id="editSave" class="btn block" type="button">Simpan</button>
      <button id="editDelete" class="btn danger block hidden" type="button">Hapus baris ini</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js?v=2.6.0"></script>
</body>
</html>
