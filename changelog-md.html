<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHANGELOG.md</title>
<style>
:root{--bg:#0b0b0c;--surface:#141416;--border:rgba(255,255,255,.08);--text:#f5f3ef;--muted:#8e8a84;--accent:#AA7655}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.title{font-weight:700}
.meta{color:var(--muted);font-size:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.done{background:#2f7d4f}
pre{margin:0;padding:16px 18px 48px;white-space:pre;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--surface)}
</style></head>
<body>
<header>
  <div><div class="title">CHANGELOG.md</div><div class="meta">Frontend · v2.6.0 · 29 baris</div></div>
  <button id="copy">Copy</button>
</header>
<pre id="code"></pre>
<script>
const CODE = "# Changelog — Reload Staff Hub (frontend)\n\nSetiap update frontend menaikkan versi di `app.js` (`APP_VERSION`), `style.css?v=` dan `app.js?v=` di `index.html`, dan ditulis di sini.\n\nVersi backend (`Code.gs`) dicatat terpisah di bawah.\n\n## 2.6.0\n- Desain ulang: header dengan profil user, menu tab pill, kartu grid untuk menu dan tim, hero sapaan di Home.\n- Versi frontend tampil di footer.\n- Font Inter dari Google Fonts.\n\n## 2.5.0\n- Tambah dan hapus baris (hard delete), semua lewat backend.\n- Hapus baris dicatat lengkap di `99_Changelog` sebelum dihapus.\n\n## 2.4.0\n- Edit isi baris lewat form.\n- Cek konflik: simpan ditolak kalau isi sheet sudah berubah sejak form dibuka.\n- Setiap edit dicatat di `99_Changelog`.\n\n## 2.3.0\n- Frontend dipisah ke GitHub Pages. Backend jadi API JSON di Apps Script.\n\n## Backend (Code.gs)\n- 2.5.0: `addRow`, `deleteRow`, dan `updateRow` dengan lock dan changelog.\n- 2.4.0: `updateRow` dengan cek konflik.\n- 2.3.0: API JSON (`doPost`) dengan whitelist fungsi.\n- 2.2.0: rebuild login NIK + PIN, sesi 6 jam, kunci 15 menit setelah 5 kali salah PIN.\n";
document.getElementById('code').textContent = CODE;
document.getElementById('copy').addEventListener('click', async function(){
  const btn = this;
  try { await navigator.clipboard.writeText(CODE); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = CODE; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.textContent = 'Tersalin'; btn.classList.add('done');
});
</script>
</body></html>
